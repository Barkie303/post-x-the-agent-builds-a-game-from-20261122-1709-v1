<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROCKET DODGE — one prompt, one game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050510; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #070718; touch-action: none;
    box-shadow: 0 0 60px rgba(90, 60, 255, .35); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
// ROCKET DODGE — built from one prompt:
// "Build a tiny browser game: a neon rocket dodges falling asteroids —
//  move with arrow keys or touch, score climbs, one hit ends the run,
//  press R to restart. Single HTML file."
//
// The game lives in a virtual 540x960 space and scales to any window.
// Add ?auto=1 to the URL and the rocket flies itself.

const W = 540, H = 960;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const AUTO = new URLSearchParams(location.search).has('auto');

let scale = 1, viewScale = 1;
function resize() {
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  viewScale = scale * dpr;
}
window.addEventListener('resize', resize);
resize();

// --- state ---------------------------------------------------------------
let state = 'title'; // title | playing | over
let score = 0, best = 0, elapsed = 0, spawnTimer = 0, shake = 0;
let rocket = { x: W / 2, y: H - 130, w: 46, h: 64, vx: 0 };
let asteroids = [], stars = [], particles = [];
let keys = { left: false, right: false };

for (let i = 0; i < 90; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.8 + 0.4, s: Math.random() * 30 + 8 });
}

function reset() {
  score = 0; elapsed = 0; spawnTimer = 0; shake = 0;
  asteroids = []; particles = [];
  rocket.x = W / 2; rocket.vx = 0;
  state = 'playing';
}

function spawnAsteroid() {
  const r = 16 + Math.random() * 26;
  const speed = 150 + Math.random() * 90 + elapsed * 6;
  asteroids.push({
    x: r + Math.random() * (W - 2 * r), y: -r - 10, r,
    vy: speed, rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 2.4, scored: false,
    bumps: Array.from({ length: 5 }, () => Math.random() * 0.35 + 0.8),
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.5, max: 1, color, r: 2 + Math.random() * 3 });
  }
}

// --- input ---------------------------------------------------------------
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === ' ' || e.key === 'Enter') {
    if (state !== 'playing') reset();
  }
  if (e.key === 'r' || e.key === 'R') {
    if (state === 'over') reset();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function pointerX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) / rect.width * W;
}
canvas.addEventListener('pointerdown', (e) => {
  if (state !== 'playing') { reset(); return; }
  rocket.x = pointerX(e.clientX);
});
canvas.addEventListener('pointermove', (e) => {
  if (e.buttons && state === 'playing') rocket.x = pointerX(e.clientX);
});

// --- autopilot (only with ?auto=1): steer away from the nearest rock -----
function autopilot(dt) {
  let threat = null;
  for (const a of asteroids) {
    if (a.y > rocket.y - 320 && a.y < rocket.y + 40) {
      if (!threat || a.y > threat.y) threat = a;
    }
  }
  const speed = 460;
  if (threat) {
    const gap = threat.x - rocket.x;
    let dir = gap > 0 ? -1 : 1; // dodge to the far side of the rock
    // don't hug the wall: if that way is a dead end, go the other way
    if ((dir < 0 && rocket.x < 90) || (dir > 0 && rocket.x > W - 90)) dir = -dir;
    rocket.x += dir * speed * dt * Math.min(1, Math.abs(gap) / 60 + 0.35);
  } else {
    rocket.x += (W / 2 - rocket.x) * 0.8 * dt; // drift back to centre
  }
  rocket.x = Math.max(30, Math.min(W - 30, rocket.x));
}

// --- update --------------------------------------------------------------
function update(dt) {
  for (const s of stars) {
    s.y += s.s * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter((p) => p.life > 0);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  if (state !== 'playing') return;
  elapsed += dt;
  score = Math.floor(elapsed * 10);

  if (AUTO) autopilot(dt);
  else {
    const speed = 420;
    if (keys.left) rocket.x -= speed * dt;
    if (keys.right) rocket.x += speed * dt;
    rocket.x = Math.max(30, Math.min(W - 30, rocket.x));
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnAsteroid();
    spawnTimer = Math.max(0.28, 0.85 - elapsed * 0.012);
  }

  for (const a of asteroids) {
    a.y += a.vy * dt;
    a.rot += a.vr * dt;
    if (!a.scored && a.y - a.r > H) {
      a.scored = true;
      burst(a.x, H - 8, '#7dd3fc', 5); // small puff as it slips past
    }
    // collision: circle (rock) vs rocket body (shrunk box)
    const dx = a.x - rocket.x, dy = a.y - rocket.y;
    if (Math.abs(dx) < a.r * 0.82 + 16 && Math.abs(dy) < a.r * 0.82 + 24) {
      state = 'over';
      best = Math.max(best, score);
      shake = 14;
      burst(rocket.x, rocket.y, '#fb7185', 42);
      burst(rocket.x, rocket.y, '#fbbf24', 26);
    }
  }
  asteroids = asteroids.filter((a) => a.y - a.r < H + 40);
}

// --- draw ----------------------------------------------------------------
function drawRock(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  for (let i = 0; i < 9; i++) {
    const ang = (i / 9) * Math.PI * 2;
    const rr = a.r * a.bumps[i % a.bumps.length];
    const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = '#8b8fa3';
  ctx.fill();
  ctx.strokeStyle = '#c3c7d6';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.arc(-a.r * 0.3, -a.r * 0.2, a.r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(a.r * 0.35, a.r * 0.3, a.r * 0.16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawRocket() {
  ctx.save();
  ctx.translate(rocket.x, rocket.y);
  // flame
  const flick = 26 + Math.random() * 14;
  const grad = ctx.createLinearGradient(0, 26, 0, 26 + flick);
  grad.addColorStop(0, '#fde68a');
  grad.addColorStop(0.5, '#fb923c');
  grad.addColorStop(1, 'rgba(239,68,68,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-9, 26); ctx.lineTo(0, 26 + flick); ctx.lineTo(9, 26);
  ctx.closePath(); ctx.fill();
  // body
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.moveTo(0, -32);
  ctx.quadraticCurveTo(15, -8, 13, 14);
  ctx.lineTo(13, 24); ctx.lineTo(-13, 24); ctx.lineTo(-13, 14);
  ctx.quadraticCurveTo(-15, -8, 0, -32);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5; ctx.stroke();
  // window + fins
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.arc(0, -6, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fb7185';
  ctx.beginPath(); ctx.moveTo(-13, 12); ctx.lineTo(-24, 28); ctx.lineTo(-13, 26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, 12); ctx.lineTo(24, 28); ctx.lineTo(13, 26); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawText(text, x, y, size, color, weight) {
  ctx.font = (weight || 700) + ' ' + size + 'px "Arial Black", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0b0620');
  sky.addColorStop(0.6, '#120a33');
  sky.addColorStop(1, '#1b0f3d');
  ctx.fillStyle = sky;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  for (const s of stars) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + s.r * 0.25) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }

  // nebula blobs
  ctx.fillStyle = 'rgba(124,58,237,.10)';
  ctx.beginPath(); ctx.arc(90, 220, 130, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(56,189,248,.08)';
  ctx.beginPath(); ctx.arc(470, 640, 150, 0, Math.PI * 2); ctx.fill();

  for (const a of asteroids) drawRock(a);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (state !== 'over') drawRocket();

  // HUD
  ctx.textAlign = 'left';
  ctx.font = '800 30px "Arial Black", Arial, sans-serif';
  ctx.fillStyle = '#f8fafc';
  ctx.fillText('SCORE ' + score, 20, 42);
  ctx.font = '700 20px Arial, sans-serif';
  ctx.fillStyle = '#a5b4fc';
  ctx.fillText('BEST ' + best, 20, 74);

  if (state === 'title') {
    ctx.fillStyle = 'rgba(5,5,16,.55)';
    ctx.fillRect(0, 0, W, H);
    drawText('ROCKET', W / 2, 300, 84, '#f8fafc');
    drawText('DODGE', W / 2, 390, 84, '#38bdf8');
    drawText('ONE PROMPT. ONE GAME.', W / 2, 470, 26, '#fbbf24');
    drawText('Dodge the rocks. Survive.', W / 2, 560, 26, '#e2e8f0', 400);
    drawText('← → move  ·  tap to steer', W / 2, 600, 24, '#94a3b8', 400);
    drawText('PRESS SPACE TO FLY', W / 2, 700, 30, '#f8fafc');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(5,5,16,.6)';
    ctx.fillRect(0, 0, W, H);
    drawText('GAME OVER', W / 2, 380, 64, '#fb7185');
    drawText('SCORE ' + score, W / 2, 470, 40, '#f8fafc');
    drawText('BEST ' + best, W / 2, 520, 28, '#a5b4fc', 400);
    drawText('PRESS R TO FLY AGAIN', W / 2, 620, 28, '#f8fafc');
  }
}

// --- loop ----------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
if (AUTO) reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
